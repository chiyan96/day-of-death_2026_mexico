<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><title>Trip Log — Mexico 2026</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#0b0d11;color:#fff}body{font-family:"Trebuchet MS",Arial,"Noto Sans TC",sans-serif}.phone{width:100%;max-width:430px;min-height:100dvh;margin:auto;background:#000;padding:max(14px,env(safe-area-inset-top)) clamp(14px,4vw,20px) max(24px,env(safe-area-inset-bottom))}.head{display:grid;grid-template-columns:44px 1fr;align-items:center}.back{width:44px;height:44px;display:grid;place-items:center;color:#fff;text-decoration:none;font-size:32px}.title{font-size:18px;font-weight:700}.city{font-size:13px;margin-top:2px}.banner-top{display:block;width:100%;height:auto;margin:4px auto 8px}</style>
<link href="../shared/trip-log.css" rel="stylesheet"/><script defer="" src="../shared/trip-log.js"></script></head><body><main class="phone trip-log-page"><header class="head"><a aria-label="Back" class="back" href="../index.html">‹</a><div><div class="title">Trip Log</div><div class="city">每餐更新</div></div></header><div class="trip-rule"></div><img alt="" class="banner-top" decoding="async" height="337" sizes="(max-width: 430px) 100vw, 430px" src="../assets_unified/banner_top-42467f44-960.webp" srcset="../assets_unified/banner_top-42467f44-480.webp 480w, ../assets_unified/banner_top-42467f44-960.webp 960w" width="1240"/><form class="trip-log-form" id="trip-log-form">
<div class="trip-field"><label for="restaurant">Restaurant Name</label><input autocomplete="organization" class="trip-control" id="restaurant" name="restaurant" required="" type="text"/></div>
<div class="trip-field"><label for="day">Day</label><div class="trip-select-wrap"><select class="trip-control trip-select" id="day" name="day" required=""><option disabled="" selected="" value="">Select Day</option><option value="1">Day 1</option><option value="2">Day 2</option><option value="3">Day 3</option><option value="4">Day 4</option><option value="5">Day 5</option><option value="6">Day 6</option><option value="7">Day 7</option><option value="8">Day 8</option><option value="9">Day 9</option></select></div></div>
<div class="trip-field"><label for="meal">Meal</label><div class="trip-select-wrap"><select class="trip-control trip-select" id="meal" name="meal" required=""><option disabled="" selected="" value="">Select Meal</option><option value="breakfast">Breakfast</option><option value="lunch">Lunch</option><option value="dinner">Dinner</option></select></div></div>
<div class="trip-field"><label for="price">Price</label><input class="trip-control" id="price" inputmode="decimal" min="0" name="price" required="" step="any" type="number"/></div>
<div class="trip-form-actions"><button class="trip-save" type="submit">Save Meal</button><button class="trip-cancel" hidden="" id="cancel-edit" type="button">Cancel Edit</button></div><div aria-live="polite" class="save-status" id="save-status" role="status"></div></form>
<section aria-labelledby="saved-meals-title" class="saved-meals"><h2 id="saved-meals-title">Saved Meals</h2><p class="saved-meals-empty" id="saved-meals-empty">No saved meals yet.</p><div id="saved-meals-list"></div></section>

</main></body></html>
