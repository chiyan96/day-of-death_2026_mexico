<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<title>Our Journey</title>
<style>
    *{box-sizing:border-box}
    html,body{margin:0;min-width:0;background:#000;color:#fff}
    body{
      font-family:"Trebuchet MS",Trebuchet,Arial,sans-serif;
      overflow-x:hidden;
    }

    /* Mobile-first page shell: normal flow + natural vertical scrolling. */
    .app{
      width:100%;
      max-width:480px;
      min-height:100dvh;
      margin-inline:auto;
      background:#000;
      padding:
        max(12px,env(safe-area-inset-top))
        clamp(10px,3.6vw,18px)
        max(26px,env(safe-area-inset-bottom));
    }

    /* Responsive header. No document-level absolute positioning. */
    .top{
      display:grid;
      grid-template-columns:44px minmax(0,1fr) 44px;
      align-items:center;
      min-height:44px;
    }
    .back{
      width:44px;
      height:44px;
      display:grid;
      place-items:center;
      justify-self:start;
      color:#fff;
      text-decoration:none;
      border-radius:50%;
      font-size:32px;
      line-height:1;
      -webkit-tap-highlight-color:transparent;
    }
    .back:focus-visible{outline:2px solid #fff;outline-offset:2px}
    .back:active{background:rgba(255,255,255,.10)}

    h1{
      margin:0;
      min-width:0;
      text-align:center;
      font-size:clamp(19px,5.1vw,22px);
      line-height:1.15;
    }
    .sub{
      margin:clamp(5px,1.8vw,9px) 0 clamp(3px,1.3vw,6px);
      text-align:center;
      font-size:clamp(11px,3.3vw,13px);
      line-height:1.35;
    }

    /* Banner keeps its native ratio and never creates horizontal overflow. */
    .route{
      display:block;
      width:100%;
      max-width:100%;
      height:auto;
      margin:0 auto clamp(7px,2vw,10px);
    }

    .days{
      display:flex;
      flex-direction:column;
      gap:clamp(7px,2vw,9px);
    }

    /*
      Same card design, now fluid:
      DAY | divider | information | responsive right-side photo.
      minmax(0,...) is important: it prevents text/grid content from forcing
      the card wider than the viewport.
    */
    .card{
      --card-color:#ff5b83;
      width:100%;
      min-width:0;
      height:clamp(68px,18vw,78px);
      border:0;
      border-radius:clamp(10px,2.8vw,12px);
      padding:0;
      display:grid;
      grid-template-columns:
        clamp(39px,11vw,48px)
        1px
        minmax(0,1.28fr)
        minmax(92px,.92fr);
      align-items:center;
      color:#000;
      text-align:left;
      font-family:inherit;
      cursor:pointer;
      overflow:hidden;
      position:relative;
      -webkit-tap-highlight-color:transparent;
    }
    .pink{
      --card-color:#ff5b83;
      background:linear-gradient(100deg,#ff3372,#ff5b83);
    }
    .yellow{
      --card-color:#ffd34d;
      background:linear-gradient(100deg,#ffbd25,#ffd34d);
    }
    .cyan{
      --card-color:#55d4ce;
      background:linear-gradient(100deg,#20c3c5,#55d4ce);
    }

    .dn{
      min-width:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      line-height:1;
      padding-left:clamp(2px,1vw,5px);
      transform:translateX(2px);
    }
    .dn b{
      margin-bottom:3px;
      font-size:clamp(12px,2.8vw,13px);
    }
    .dn strong{
      font-size:clamp(23px,6.1vw,27px);
      font-weight:700;
    }

    .divider{
      width:1px;
      height:68%;
      background:#111;
      justify-self:center;
    }

    .info{
      min-width:0;
      align-self:stretch;
      display:flex;
      flex-direction:column;
      justify-content:center;
      padding:
        clamp(5px,1.4vw,7px)
        clamp(4px,1.2vw,7px)
        clamp(5px,1.4vw,7px)
        clamp(7px,2.3vw,11px);
      z-index:2;
      transform:translateX(2px);
    }
    .place{
      display:block;
      min-width:0;
      margin-bottom:clamp(5px,1.6vw,8px);
      font-size:clamp(13.5px,3.3vw,15px);
      line-height:1.05;
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .icons{
      min-width:0;
      height:clamp(20px,5.8vw,24px);
      display:flex;
      gap:clamp(6px,2.3vw,10px);
      align-items:center;
    }
    .icons img{
      flex:0 0 auto;
      width:clamp(19px,5.6vw,23px);
      height:clamp(19px,5.6vw,23px);
      object-fit:contain;
    }

    .photo{
      align-self:stretch;
      min-width:0;
      width:100%;
      background-size:cover;
      background-position:center;
      position:relative;
    }
    /* Existing color-to-photo blend, made independent of fixed widths. */
    .photo::before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(
        90deg,
        var(--card-color) 0%,
        color-mix(in srgb,var(--card-color) 72%,transparent) 18%,
        transparent 52%
      );
      pointer-events:none;
    }

    .chev{
      position:absolute;
      right:clamp(6px,2vw,9px);
      top:50%;
      transform:translateY(-50%);
      z-index:4;
      color:#000;
      font-size:clamp(36px,9vw,42px);
      line-height:1;
      text-shadow:none;
      pointer-events:none;
    }

    /* Small phones: preserve design while allocating enough width to text. */
    @media (max-width:350px){
      .app{padding-inline:9px}
      .card{
        grid-template-columns:38px 1px minmax(0,1.38fr) minmax(78px,.82fr);
      }
      .info{padding-left:7px;padding-right:3px}
      .icons{gap:5px}
      .place{font-size:13.5px}
    }

    /* Tablet/desktop: keep the mobile itinerary identity instead of stretching. */
    @media (min-width:600px){
      .app{max-width:500px;padding-inline:20px}
      .card{height:78px}
    }

    @media (prefers-reduced-motion:reduce){
      *{scroll-behavior:auto!important}
    }
  </style>
